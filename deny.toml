[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/tpt-solutions/tpt-av-control",
    "https://github.com/tpt-solutions/tpt-av-asset",
    "https://github.com/tpt-solutions/tpt-audio",
    "https://github.com/tpt-solutions/tpt-dsp",
    "https://github.com/tpt-solutions/tpt-cadence",
    "https://github.com/tpt-solutions/tpt-av-ui",
    "https://github.com/tpt-solutions/tpt-av-sync",
    "https://github.com/tpt-solutions/tpt-av-test",
    "https://github.com/tpt-solutions/tpt-kinetix",
]
